[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "librechat-tmux-bridge"
version = "0.1.0"
description = "Universal bidirectional bridge between LibreChat and host tmux sessions for zero-token terminal driving and agentic copilot interaction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Steven T. Pelech" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "mcp>=1.0.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
librechat-tmux-bridge = "librechat_tmux_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/librechat_tmux_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=librechat_tmux_bridge --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
